# fly.toml app configuration file generated for worldforge-empty-hill-2499 on 2026-10-30T17:28:11+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'worldforge-empty-hill-2499'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  PORT = '8787'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
